apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-orchestrator
  namespace: ai-orchestrator
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: orchestrator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: orchestrator-ui, port: { number: 5001 } }
    - host: agentic-team.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: agentic-team-ui, port: { number: 5002 } }
    - host: context-dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: context-dashboard, port: { number: 5003 } }
