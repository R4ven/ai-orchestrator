apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-dashboard
  namespace: ai-orchestrator
  labels: { app: context-dashboard }
spec:
  replicas: 1
  selector:
    matchLabels: { app: context-dashboard }
  template:
    metadata:
      labels: { app: context-dashboard }
    spec:
      containers:
        - name: context-dashboard
          image: ai-orchestrator:latest
          command: ["node", "packages/context-dashboard/dist/index.js"]
          ports:
            - containerPort: 5003
          envFrom:
            - configMapRef: { name: ai-orchestrator-config }
          env:
            - { name: PORT, value: "5003" }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
