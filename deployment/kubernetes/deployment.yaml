apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-ui
  namespace: ai-orchestrator
  labels: { app: orchestrator-ui }
spec:
  replicas: 2
  selector:
    matchLabels: { app: orchestrator-ui }
  template:
    metadata:
      labels: { app: orchestrator-ui }
    spec:
      containers:
        - name: orchestrator-ui
          image: ai-orchestrator:latest
          command: ["node", "apps/orchestrator-ui/dist/server.js"]
          ports:
            - containerPort: 5001
          envFrom:
            - configMapRef: { name: ai-orchestrator-config }
          env:
            - { name: PORT, value: "5001" }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          livenessProbe:
            httpGet: { path: /api/health, port: 5001 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/health, port: 5001 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
