<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agentic Team</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header>
    <h1>Agentic Team</h1>
    <div id="validBadge" class="badge">checking...</div>
  </header>

  <main>
    <section class="panel form-panel">
      <label for="task">Task</label>
      <textarea id="task" rows="4" placeholder="Describe what you want the team to build..."></textarea>

      <div class="row">
        <div class="field">
          <label for="maxTurns">Max turns</label>
          <input id="maxTurns" type="number" min="1" max="50" placeholder="default (12)" />
        </div>
      </div>

      <button id="runBtn">Start team</button>

      <div class="roster" id="roster"></div>
    </section>

    <section class="panel log-panel">
      <h2>Team conversation</h2>
      <div id="log" class="log"></div>
    </section>

    <section class="panel output-panel">
      <h2>Final deliverable</h2>
      <pre id="output">Start a task to see the team's final response here.</pre>
    </section>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
