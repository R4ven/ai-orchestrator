version: "3.8"

# ──────────────────────────────────────────────────────────────────────────────
# AI Orchestrator — Docker Compose
#
# Core services (always started):
#   orchestrator-ui    → http://localhost:5001
#   agentic-team-ui    → http://localhost:5002
#   context-dashboard  → http://localhost:5003
#   mcp-server         → stdio via `docker compose run mcp-server` (not a long-running HTTP service)
#
# Optional monitoring profile (docker compose --profile monitoring up):
#   prometheus         → http://localhost:9091
#   grafana            → http://localhost:3000
# ──────────────────────────────────────────────────────────────────────────────

services:
  orchestrator-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-orchestrator:latest
    container_name: orchestrator-ui
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=5001
    volumes:
      - ./packages/orchestrator/config:/app/packages/orchestrator/config:ro
      - ./output:/app/output
      - ./workspace:/app/workspace
      - ./reports:/app/reports
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - orchestrator-context:/home/appuser/.ai-orchestrator
    ports:
      - "5001:5001"
    networks:
      - ai-tools-network
    command: ["node", "apps/orchestrator-ui/dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  agentic-team-ui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-orchestrator:latest
    container_name: agentic-team-ui
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=5002
    volumes:
      - ./packages/agentic-team/config:/app/packages/agentic-team/config:ro
      - ./output:/app/output
      - ./workspace:/app/workspace
      - ./reports:/app/reports
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - agentic-team-context:/home/appuser/.agentic-team
    ports:
      - "5002:5002"
    networks:
      - ai-tools-network
    command: ["node", "apps/agentic-team-ui/dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  context-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-orchestrator:latest
    container_name: ai-tools-context-dashboard
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=5003
    volumes:
      - orchestrator-context:/home/appuser/.ai-orchestrator
      - agentic-team-context:/home/appuser/.agentic-team
    ports:
      - "5003:5003"
    networks:
      - ai-tools-network
    command: ["node", "packages/context-dashboard/dist/index.js"]
    depends_on:
      - orchestrator-ui
      - agentic-team-ui
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5003/api/stats').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-orchestrator:latest
    container_name: ai-tools-mcp-server
    environment:
      - LOG_LEVEL=info
    volumes:
      - orchestrator-context:/home/appuser/.ai-orchestrator
      - agentic-team-context:/home/appuser/.agentic-team
    networks:
      - ai-tools-network
    command: ["node", "packages/mcp-server/dist/index.js"]
    stdin_open: true
    tty: true
    profiles:
      - mcp

  prometheus:
    image: prom/prometheus:latest
    container_name: ai-tools-prometheus
    restart: unless-stopped
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - ai-tools-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: ai-tools-grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ai-tools-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    profiles:
      - monitoring

networks:
  ai-tools-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  orchestrator-context:
  agentic-team-context:
